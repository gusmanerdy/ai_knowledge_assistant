services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-knowledge-postgres
    environment:
      POSTGRES_DB: ai_knowledge_assistant
      POSTGRES_USER: ai_knowledge
      POSTGRES_PASSWORD: ai_knowledge_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_knowledge -d ai_knowledge_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
